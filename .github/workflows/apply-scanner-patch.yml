name: Apply Scanner Continuous Quantity Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Apply scanner patch
        run: git apply --check ANBARIN_SCANNER_CONTINUOUS_QTY.patch && git apply ANBARIN_SCANNER_CONTINUOUS_QTY.patch

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/scanner.ts
          git commit -m "Optimize continuous barcode scanning with quantity dialog"
          git push
